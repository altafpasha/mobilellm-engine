[workspace]
resolver = "2"
members = [
    "crates/mobilellm-core",
    "crates/mobilellm-gpu",
    "crates/mobilellm-diagnostics",
    "crates/mobilellm-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MobileLLM Systems Team"]
license = "Apache-2.0"
description = "MobileLLM Hybrid Rust Systems Subsystem"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
strip = true
