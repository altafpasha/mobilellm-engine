[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobilellm"
version = "0.1.0"
description = "MobileLLM Python SDK, CLI & OpenAI-compatible edge server"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "MobileLLM Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/codesec-ai/mobilellm-engine"
Documentation = "https://github.com/codesec-ai/mobilellm-engine/tree/main/python"
Repository = "https://github.com/codesec-ai/mobilellm-engine.git"
Issues = "https://github.com/codesec-ai/mobilellm-engine/issues"

[project.scripts]
mobilellm = "mobilellm.cli.main:main"
mobilellm-cli = "mobilellm.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["mobilellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "mobilellm.bindings.native_client"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
