name: Python SDK CI

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy hatchling httpx pytest

      - name: Run Ruff Lint Check
        run: |
          ruff check python/mobilellm python/tests

      - name: Run Ruff Format Check
        run: |
          ruff format --check python/mobilellm python/tests

      - name: Run Mypy Strict Typecheck
        run: |
          mypy python/mobilellm

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[dev]"

      - name: Run Pytest Suite
        run: |
          pytest python/tests -v -k "not test_integration_native"

  build-package:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Wheel and Source Distribution
        run: |
          python -m build python/

      - name: Check Artifacts
        run: |
          ls -la python/dist/

