name: Android SDK CI

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-build-and-test:
    name: Build & Test Android SDK (AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android NDK & CMake
        run: |
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          echo "Accepting SDK licenses..."
          yes | sdkmanager --licenses || true
          echo "Installing NDK 27.1.12297006 and CMake 3.22.1..."
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Ensure Executable Permissions
        run: chmod +x android/gradlew

      - name: Run Android SDK Unit Tests
        run: |
          cd android
          ./gradlew :sdk:test --stacktrace

      - name: Assemble Release AAR
        run: |
          cd android
          ./gradlew :sdk:assembleRelease --stacktrace

      - name: Verify AAR Artifact & 16KB Page Alignment
        run: |
          echo "Locating built AAR:"
          find android/sdk/build/outputs/aar/ -name "*.aar"
          AAR_PATH=$(find android/sdk/build/outputs/aar/ -name "*-release.aar" | head -n 1)
          if [ -z "$AAR_PATH" ]; then
            echo "ERROR: Release AAR was not produced!"
            exit 1
          fi
          echo "Found AAR at: $AAR_PATH"
          mkdir -p /tmp/aar_inspect
          unzip -q "$AAR_PATH" -d /tmp/aar_inspect
          echo "Contents of release AAR:"
          ls -la /tmp/aar_inspect/
          echo "Native libraries in AAR:"
          find /tmp/aar_inspect/jni/ -name "*.so"

      - name: Upload SDK AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilellm-sdk-aar
          path: android/sdk/build/outputs/aar/*-release.aar
          retention-days: 14
